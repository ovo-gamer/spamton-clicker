<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background-color: #555;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0; padding: 0;
            overflow: hidden;
            height: 100vh; width: 100vw;
        }
        #filtro-tinta-vermelha {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(255, 0, 0, 0);

            pointer-events: none;
            mix-blend-mode: color;
            transition: background-color 1s linear;
        }
        #filtro-tinta-preto-e-branco {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;

            transition: backdrop-filter 0.5s ease-in-out;
        }
    </style>
    <style>
        #tela-titulo {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;

            z-index: 99999990;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 20px;
        }
        #titulo-jogo {
            font-size: 32px; color: cyan; font-weight: bold;
            text-shadow: 3px 3px 0px black; margin-bottom: 20px;
        }
        .botao-menu {
            background-color: #0055ff; color: white;
            border: 3px solid white; padding: 15px 30px;
            font-size: 20px; cursor: pointer;
            font-family: 'Courier New', monospace; font-weight: bold;
            min-width: 280px; box-shadow: 4px 4px 0px black;
            text-shadow: 2px 2px 0px #000; transition: background-color 0.2s;
        }
        .botao-menu:hover { background-color: #0033cc; }
        .sub-tela {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #001188; z-index: 99999995;
            display: none; flex-direction: column;
            align-items: center; justify-content: center; gap: 20px;
        }
        .menu-scroll {
            width: 80%;
            max-width: 600px;
            max-height: 40vh;
            overflow-y: auto;
            background-color: rgba(0, 0, 0, 0.4);
            border: 2px solid white;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .menu-scroll p {
            font-size: 18px;
            color: white;
            text-shadow: 1px 1px black;
            margin: 10px 0;
            line-height: 1.4;
        }

            font-weight: bold;
            text-shadow: 2px 2px black;
            margin-top: 25px;
            margin-bottom: 10px;

        }

    <style>

            align-items: center; justify-content: center; gap: 20px;
            backdrop-filter: blur(4px);
        }
        #area-jogo {
            display: none; width: 100%; height: 100vh; position: relative; image-rendering: pixelated;
            background-image: url('loja_background.png');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: 1;
        }
        .fundo-camada-alt {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('loja_background_alt.png');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out !important;
        }
        #area-jogo::before {
            content: ""; position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0); z-index: 0;
        }
        .container {
            position: relative; width: 100%; height: 100vh;

    <style>

        }

        }

            z-index: 9999999 !important;

        }

    <style>
        @keyframes rushEVibrarOpa {
            0% { transform: scale(1) translate(0px, 0px); opacity: 1; }
            10% { transform: scale(4.5) translate(-2px, 1.5px); opacity: 1; }
            20% { transform: scale(8.0) translate(2.5px, -2.5px); opacity: 1; }
            30% { transform: scale(11.5) translate(-1.5px, -1px); opacity: 1; }
            40% { transform: scale(15.0) translate(2px, 2px); opacity: 1; }
            50% { transform: scale(18.5) translate(-2.5px, -2px); opacity: 1; }
            60% { transform: scale(22.0) translate(1.5px, 0.5px); opacity: 1; }
            70% { transform: scale(25.5) translate(-0.5px, 1px); opacity: 1; }
            80% { transform: scale(29.0) translate(1px, -1px); opacity: 1; }
            90% { transform: scale(32.0) translate(-1px, 0.5px); opacity: 1; }
            100% { transform: scale(35.0) translate(0px, 0px); opacity: 1; }

        .cor-azul { background-color: #0055ff !important; color: white !important; display: none; }
    </style>
    <style>
        #area-botoes-config-jogo {
            position: absolute; top: 15px; right: 15px; z-index: 10;
            display: flex; flex-direction: column; gap: 8px;
        }

            background: #222; color: cyan; border: 1px solid cyan;

            text-shadow: 2px 2px 0px #000; pointer-events: none !important;

        }
        .pipis-particle {
            position: fixed; top: 0; left: 0; pointer-events: none !important;

        .gaster-vibrando { animation: gasterVibrarCaotico 0.08s infinite linear !important; }
        .lancer-salto-anim { animation: lancerSalto 0.4s ease-out; }
        .pink-salto-anim { animation: pinkSalto 0.3s ease-out; }
        @keyframes lancerSalto {
            0% { transform: translateY(0); }
            50% { transform: translateY(-40px); }
            100% { transform: translateY(0); }
        }
        @keyframes pinkSalto {
            0% { transform: translateY(-50%); }
            50% { transform: translateY(-80%); }
            100% { transform: translateY(-50%); }

        #tela-morte { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: black; z-index: 99999995 !important; display: none; opacity: 0; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease-in-out !important; }
        #texto-morte { color: red; font-size: 40px; font-weight: bold; text-shadow: 3px 3px 0px #300; font-family: 'Courier New', Courier, monospace; line-height: 1.5; transition: opacity 0.5s ease-in-out !important; }
        #sprite-telefone { transition: filter 0.5s ease-in-out !important; }
    </style>
</head>

        let cheatDetectado = false, modoMorteAtivo = false, risadasMutadas = false, screenTitleActive = true, telaDeMorteVisivel = false;

    <script>
        function abrirSubTela(id) { document.getElementById(id).style.display = "flex"; }
        function fecharSubTela(id) { document.getElementById(id).style.display = "none"; }
        function atualizarSpriteTelefone() {
            const areaJogo = document.getElementById("area-jogo");
            const estaNoJogo = Boolean(areaJogo && getComputedStyle(areaJogo).display !== "none");

            const spriteAlternativoAtivo = Boolean(estaNoJogo && telaDeMorteVisivel === true);
            document.body.classList.toggle("telefone-na-morte", spriteAlternativoAtivo);

            const protegerDaTinta = Boolean(estaNoJogo && modoMorteAtivo === true);
            if (typeof gerenciarCamadasMorte === "function") {
                gerenciarCamadasMorte(protegerDaTinta, areaJogo);
            }
        }

        function entrarNoJogo() {
            document.getElementById("tela-titulo").style.display = "none";
            document.getElementById("area-jogo").style.display = "block";
            atualizarSpriteTelefone();
            if (musicaHabilitada && musicaNativa.paused && !cheatDetectado) {
                musicaNativa.volume = 0.3; musicaNativa.play().catch(function() {});
            }
        }
        function abrirMenuDePausaOpa() { if (!cheatDetectado) document.getElementById("tela-pausa").style.display = "flex"; }
        function retomarJogoDaPausa() { document.getElementById("tela-pausa").style.display = "none"; }
        function menuPrincipalReloadCompleto() { salvarDadosNoNavegador(); location.reload(); }

        function alternarMutarRisadas() {
            if (cheatDetectado) return;
            risadasMutadas = !risadasMutadas;
            document.getElementById("cfg-risadas").textContent = risadasMutadas ? "RISADAS: OFF" : "RISADAS: ON";
            localStorage.setItem("cfg_save_risadas", risadasMutadas);
        }
    </script>
    <script>
        function alternarMusicaNativa() {
            if (cheatDetectado) return;
            musicaHabilitada = !musicaHabilitada;
            document.getElementById("cfg-musica").textContent = musicaHabilitada ? "MÚSICA: ON" : "MÚSICA: OFF";
            localStorage.setItem("cfg_save_musica", musicaHabilitada);
            if (document.getElementById("area-jogo").style.display === "block") {
                if (musicaHabilitada) { musicaNativa.volume = 0.3; musicaNativa.play().catch(function() {}); }
                else { musicaNativa.pause(); }
            }
        }
        document.getElementById("cfg-musica").textContent = musicaHabilitada ? "MÚSICA: ON" : "MÚSICA: OFF";

        function cliqueNoTelefone() {
            if (telaDeMorteVisivel === true) {
                if (Math.random() <= 0.10) { window.open(CONFIG_LINKS.tv, "_blank"); }
                else { window.open(CONFIG_LINKS.sighting, "_blank"); }
            } else { window.open(CONFIG_LINKS.padrao, "_blank"); }
        }
        function executarPunicaoCheat() {
            cliquesNesseSegundo = 0;
            if (weirdRouteLevel < 1997) {
                weirdRouteLevel++;
            }
            
            let backupWeirdRoute = weirdRouteLevel;
            
            localStorage.clear();
            
            localStorage.setItem("save_wrd", backupWeirdRoute);
            localStorage.setItem("cfg_save_risadas", "false");
            localStorage.setItem("cfg_save_musica", "true");
            
            cheatDetectado = true;
            modoMorteAtivo = true;

            atualizarSpriteTelefone();
            musicaNativa.pause();
            document.getElementById("tela-pausa").style.display = "none";
            spriteSpamtonImg.src = "spamton_sprite_frame3.png";
            filterTinta.style.backgroundColor = "rgba(255, 0, 0, 1)";

            botaoKPC.style.pointerEvents = "none";
            botaoPowerUp.style.pointerEvents = "none";

                falaSpamtonDiv.textContent = falasGritoCheat[Math.floor(Math.random() * falasGritoCheat.length)];

        }

        function atualizarKromer() { if (!cheatDetectado) { kromer += kromerPorSegundo; kromerLabel.textContent = `Kromer: ${Math.floor(kromer)}`; produzirPassivoPinkMewMew(); salvarDadosNoNavegador(); } }
        function gerarItemKPS() { custoItemKPS = (Math.floor(Math.random() * 10) + 1) * (kromerPorSegundo === 0 ? 1 : kromerPorSegundo); botaoKPS.innerHTML = `[AUMENTA KPS]<br>COMPRAR ${itensKPS[Math.floor(Math.random() * itensKPS.length)].nome} (${custoItemKPS} Kromer)`; }
        function gerarItemKPC() { custoItemKPC = (Math.floor(Math.random() * 10) + 1) * kromerPorClique; botaoKPC.innerHTML = `[AUMENTA KPC]<br>COMPRAR ${itensKPC[Math.floor(Math.random() * itensKPC.length)].nome} (${custoItemKPC} Kromer)`; }
        function deletarProgressoManual() { localStorage.clear(); location.reload(); }
        function atualizarFalaSpamton() { if (!cheatDetectado) { falaSpamtonDiv.textContent = falasSpamton[Math.floor(Math.random() * falasSpamton.length)]; falaSpamtonDiv.style.color = "yellow"; } }
        
        function rolarFalaInicialComPeso() {
            if (!cheatDetectado) {
                if (Math.random() <= 0.70) { falaSpamtonDiv.textContent = "OLÁ, [Cliente Valioso]!"; falaSpamtonDiv.style.color = "yellow"; }
                else { atualizarFalaSpamton(); }
            }
        }

        botaoKPS.addEventListener("click", comprarKPS);
        botaoKPC.addEventListener("click", comprarKPC);
        botaoPowerUp.addEventListener("click", comprarPowerUp);
        spriteSpamtonImg.addEventListener("click", cliqueManual);
        
        document.addEventListener("DOMContentLoaded", function() { carregarDadosDoNavegador(); gerarItemKPS(); gerarItemKPC(); rolarFalaInicialComPeso(); atualizarPainelTexto(); });
        document.addEventListener("visibilitychange", function() { if (document.hidden) cliquesNesseSegundo = 0; });
        
        setInterval(atualizarKromer, 1000);
        setInterval(atualizarFalaSpamton, 5000);
        setInterval(animarSprite, 500);
        setInterval(alternarCoresBotoes, 1000);
        setInterval(function() { cliquesNesseSegundo = 0; }, 1000);
        setInterval(dispararAparicaoBotaoAzul, 300000);
        setInterval(lancarPipisDoLancer, 30000);
        setInterval(dispararEventoMonocromaticoGaster, 60000);
        setInterval(verificarSorteioWeirdRoute, 1000);

        function renderizarTextoComoJogar() {
            const container = document.getElementById("conteudo-como-jogar");
            if (!container) return;
            
            const textoComoJogarCru = "*KROMER*\nKromer é a moeda que você usará para progredir nesse jogo, para começar, clique no Spamton para gerar 1 kromer, não se preocupe, conseguir kromer será mais fácil depois\n*LOJA*\nA loja é o lugar onde sua produção de kromer aumentará ao longo do tempo, inicialmente ela tem dois botões, o de cima aumenta KPS (kromer por segundo), o de baixo aumenta KPC (kromer por clique), ocasionalmente um terceiro botão azul vai aparecer e vai conceder um dos 4 power-ups\n*POWER-UPS*\nPower-ups são outros darkners que você pode contratar e evoluir, mas antes de explicar como cada um deles funciona eu vou explicar algo necessário para eles funcionarem\n*PIPIS*\nQuando você gera kromer ao clicar no Spamton, alguns $ aparecem, eles começaram sendo uma decoração durante o desenvolvimento do jogo mais viraram uma função excencial para progredir com power-ups, a cada $ que aparece, há uma pequena chance do $ ser substituído por um pipis, no começo eles parecem um easter egg legal mas em breve terão importância\n*IMAGE_FRIEND*\nEsse darkner é o mais importante para os outros power-ups funcionarem bem, quando um pipis aparece na tela, o FRIEND irá imediatamente pegá-lo para conceder uma quantia de kromer em troca, conforme o FRIEND evolui, a chance de um pipis aparecer no lugar de um $ aumenta levemente, isso ajudará depois\n*LANCER*\nLancer é um ótimo companheiro caso você se sinta sozinho nessa jornada, ele trouxe sua bicicleta motorizada para melhorar a poluição do ambiente e faz um som engraçado quando você clica nele, mas ele não está lá só pra brincar, ocasionalmente ele joga alguns pipis para o FRIEND pegar (eu não disse que ele seria importante?), conforme Lancer evolui, ele joga mais pipis de uma vez (legal né?)\n*GASTER*\nTambém conhecido como Homem Misterioso, Gaster ocasionalmente deixará sua tela monocromática, enquanto joga alguns pipis para o FRIEND pegar, conforme o Gaster evolui, ele joga mais pipis também\n*PINK*\nOu Mew Mew pra quem só joga Undertale, ela é um passo importante para progressão, suponhamos que você gastou muito kromer em KPC, mas quer deixar o jogo rodando afk, não se preocupe! Pink age como o seu mouse, e gera kromer a cada segundo, mas ao invés de gerar a quantia baseada em KPS, ela gera baseada em KPC, ou seja, ela clica por você, conforme a Pink evolui, ela gera mais $ e as chances de pipis gerados por ela aumenta\n*MENUS E CONFIGURAÇÕES*\nVocê acha que eu não ia citar isso? claro que não! eu vou explicar agora!\n*MENU PRINCIPAL*\nO lugar onde tudo começa, aqui tem alguns botões que podem ou não ajudar :)\n*BOTÃO \"JOGAR\"*\nFaz você jogar\n*BOTÃO \"CONFIGURAÇÕES\"*\nAqui você pode ligar ou desligar a música e as risadas dos darkners que você contratou, também tem como resetar o progresso aqui mas a gente já resetou demais em Undertale\n*BOTÃO \"CRÉDITOS\"*\nAqui temos os nomes dos criadores desse jogo, que se dedicaram muito para fazer tudo funcionar (não conta pra ninguém mas eu copiei muito código de muitos sites e remendei tudo junto)\n*BOTÃO \"COMO JOGAR\"*\nTraz você pra esse submenu!\n*MENU DE PAUSA*\nBasicamente uma curta versão do menu principal mas ele fica dentro do jogo pra você acessar enquanto assiste o caos!\n*EXTRAS*\nDaqui pra frente tem algumas features simples que não merecem um tópico maior (que pena)\n*TELEFONE*\nUm simples telefone para mandar você pra algum lugar, clique nele, talvez não\n*DIÁLOGO*\nUm texto em cima do Spamton informando o que está acontecendo no jogo, e as vezes é só o Spamton falando com você, quem sabe?\n*ANTI-CHEAT*\nAlguma hora você vai descobrir, ele impede você de ser um trapaceiro sujo (e também atrapalha a conexão telefônica), bem, as coisas tomaram uma rota estranha não é?\n*FIM*\nÉ só isso por enquanto, agora vá jogar e se torne um [[BIG SHOT]]!!1";
            
            const linhas = textoComoJogarCru.split("\n");
            container.innerHTML = "";
            
            linhas.forEach(function(linha) {
                const paragrafo = document.createElement("p");
                
                if (linha.trim().startsWith("*") && linha.trim().endsWith("*")) {
                    paragrafo.textContent = linha.replace(/\*/g, "");
                    paragrafo.className = "topico-cyan";
                } else {
                    paragrafo.textContent = linha;
                }
                
                container.appendChild(paragrafo);
            });
        }

        document.addEventListener("DOMContentLoaded", renderizarTextoComoJogar);
        function verificarSorteioWeirdRoute() {
            if (cheatDetectado || weirdRouteLevel === 0) return;
            if (document.getElementById("area-jogo").style.display !== "block") return;

            let sorteioSegredo = Math.floor(Math.random() * 1997) + 1;
            if (sorteioSegredo <= weirdRouteLevel) {
                const areaJogoCorreta = document.getElementById("area-jogo");
                let somJingle = null;

                let fundoAlt = document.createElement("div");
                fundoAlt.className = "fundo-camada-alt";
                if (areaJogoCorreta) {
                    areaJogoCorreta.insertBefore(fundoAlt, areaJogoCorreta.firstChild);
                    setTimeout(function() {
                        fundoAlt.style.opacity = "1";
                    }, 20);
                }

                if (!risadasMutadas) {
                    somJingle = new Audio('weird_route_jingle.mp3');
                    somJingle.volume = 0.5;
                    somJingle.play().catch(function() {});
                }

                let elPipis = document.createElement('img');
                elPipis.src = 'pipis_alt.png';
                elPipis.className = 'pipis-particle';
                elPipis.style.transform = "translate(-1000px, -1000px)";
                if (areaJogoCorreta) {
                    areaJogoCorreta.appendChild(elPipis);
                }

                let posX = window.innerWidth / 2 - 16;
                let posY = 0;
                let velY = 0;
                let velX = 0;
                let gravidade = 0.15;
                let iRot = 0;
                let velRot = (Math.random() * 6 - 3);

                let loopQuedaPipis = setInterval(function() {
                    velY += gravidade;
                    posY += velY;
                    iRot += velRot;
                    elPipis.style.transform = `translate(${posX}px, ${posY}px) rotate(${iRot}deg)`;

                    if (nivelPowerUpPipis > 0 && velY > 0) {
                        clearInterval(loopQuedaPipis);
                        elPipis.ehAlt = true;
                        executarMecanicaFriendDuplicavel(elPipis, posX, posY, velX, velY, gravidade, iRot, velRot);
                        return;
                    }

                    if (posY > window.innerHeight + 50) {
                        clearInterval(loopQuedaPipis);
                        elPipis.remove();
                    }
                }, 16);

                setTimeout(function() {
                    if (fundoAlt) {
                        fundoAlt.style.opacity = "0";
                        setTimeout(function() {
                            fundoAlt.remove();
                        }, 500);
                    }
                    if (somJingle) {
                        somJingle.pause();
                        somJingle.remove();
                    }
                }, 3000);
            }
        }
    </script>
